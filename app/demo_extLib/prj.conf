# Configuration for demo_extLib
# Uses prebuilt libdemo library with configurable build type

# Basic configuration
CONFIG_SERIAL=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=2048

# Libdemo build type selection
# Use CONFIG_LIBDEMO_BUILD_DEBUG=y for debug version (default)
# Use CONFIG_LIBDEMO_BUILD_RELEASE=y for release version
CONFIG_LIBDEMO_BUILD_DEBUG=y
# CONFIG_LIBDEMO_BUILD_RELEASE=y 

# Application-specific settings
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096
