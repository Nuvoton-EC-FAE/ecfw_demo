# Enable assertions
CONFIG_ASSERT=y

# Set assertion level
CONFIG_ASSERT_LEVEL=1

# Enable logging for assertion messages
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_OUTPUT_TEXT=y
CONFIG_LOG_MODE_IMMEDIATE=y


# Enable serial console for output
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Enable shell for interactive logging
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="zp:~$ "
